# All values are set by terraform/cluster-addons (helm_release.argocd_repo_secret).
region: ""
serviceAccount:
  name: external-secrets
  namespace: external-secrets
# Name of the Secrets Manager secret. The App ID, installation ID and private key live only in it.
secretName: ""
repoUrl: ""
refreshInterval: 1h
# The GitHub OAuth App credential for Argo CD sign-in. secretName is the Secrets Manager secret; k8sName is the
# Kubernetes Secret Dex reads. Empty secretName renders nothing.
sso:
  secretName: ""
  k8sName: argocd-github-sso
