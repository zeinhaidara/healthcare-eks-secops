{{- if .Values.sso.secretName }}
# Builds the Secret Dex reads for GitHub sign-in. Argo CD only reads a Secret other than argocd-secret when it
# has the part-of label below. The Secrets Manager keys are OAuth-Client-ID and OAuth-Client-Secret; the
# Kubernetes keys are the names the Dex connector config refers to ($<secret>:dex.github.clientID).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.sso.k8sName }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: {{ .Values.sso.k8sName }}
    creationPolicy: Owner
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: dex.github.clientID
      remoteRef:
        key: {{ .Values.sso.secretName | quote }}
        property: OAuth-Client-ID
    - secretKey: dex.github.clientSecret
      remoteRef:
        key: {{ .Values.sso.secretName | quote }}
        property: OAuth-Client-Secret
{{- end }}
