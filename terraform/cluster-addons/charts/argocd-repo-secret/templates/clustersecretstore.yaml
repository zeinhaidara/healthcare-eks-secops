# Secrets Manager in the cluster's region. Authentication is the External Secrets service account,
# which carries the IRSA role annotation. No static keys.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "region is required" .Values.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.serviceAccount.name | quote }}
            namespace: {{ .Values.serviceAccount.namespace | quote }}
