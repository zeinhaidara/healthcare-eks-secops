# Builds the Argo CD repository Secret "healthcare-repo" from the Secrets Manager JSON keys.
# The Go template expressions below are for External Secrets, so Helm must not evaluate them.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: healthcare-repo
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.refreshInterval | quote }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: healthcare-repo
    creationPolicy: Owner
    template:
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: {{ required "repoUrl is required" .Values.repoUrl | quote }}
        githubAppID: {{ "{{ .githubAppID }}" | quote }}
        githubAppInstallationID: {{ "{{ .githubAppInstallationID }}" | quote }}
        githubAppPrivateKey: {{ "{{ .githubAppPrivateKey }}" | quote }}
  data:
    - secretKey: githubAppID
      remoteRef:
        key: {{ required "secretName is required" .Values.secretName | quote }}
        property: githubAppID
    - secretKey: githubAppInstallationID
      remoteRef:
        key: {{ .Values.secretName | quote }}
        property: githubAppInstallationID
    - secretKey: githubAppPrivateKey
      remoteRef:
        key: {{ .Values.secretName | quote }}
        property: githubAppPrivateKey
