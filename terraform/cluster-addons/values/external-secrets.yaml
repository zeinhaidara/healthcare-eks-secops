# External Secrets Operator on Fargate. It syncs the Argo CD GitHub App credential from Secrets
# Manager. The IRSA annotation on the service account is added by Terraform, so no role ARN is here.
installCRDs: true

serviceAccount:
  create: true
  name: external-secrets

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

# Fargate reserves port 10250, so the webhook listens on 10260.
webhook:
  port: 10260
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi

certController:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
