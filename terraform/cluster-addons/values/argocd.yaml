# Argo CD on Fargate. Git is read with the GitHub App credential in the Secret "healthcare-repo", which External
# Secrets builds from Secrets Manager (docs/runbooks/argocd-bootstrap.md). Argo has no AWS role. The UI ingress, host, certificate, the Dex
# GitHub connector and RBAC are set in main.tf (helm_release.argocd) from variables. Notifications are off.
# Requests are set because Fargate sizes a pod from them.
dex:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 128Mi

notifications:
  enabled: false

controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 512Mi

server:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi

repoServer:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi

applicationSet:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 128Mi
