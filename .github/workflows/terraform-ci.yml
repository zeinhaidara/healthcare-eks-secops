name: terraform-ci

# Static checks only. No plan, no AWS credentials, no OIDC. Independent of app-ci.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  validate:
    name: tf-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      # Reports success when terraform/ has no code yet so the required check never stalls.
      - name: fmt, init, validate
        run: |
          if ! ls terraform/*.tf >/dev/null 2>&1; then echo "no terraform code yet"; exit 0; fi
          terraform fmt -check -recursive terraform
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

  checkov:
    name: tf-checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install checkov==3.3.26
      - name: Checkov (terraform)
        run: |
          mkdir reports
          if ! ls terraform/*.tf >/dev/null 2>&1; then echo "no terraform code yet"; exit 0; fi
          checkov --config-file security/checkov/terraform.yaml \
            --output json --output sarif --output-file-path reports
      - name: Failed checks
        if: failure()
        run: |
          jq -r '.. | .failed_checks? // empty | .[] | "\(.check_id) \(.file_path) \(.resource)"' reports/results_json.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checkov-terraform-reports
          path: reports/
          retention-days: 90
          if-no-files-found: ignore
