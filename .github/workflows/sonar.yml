name: sonar

# SonarCloud scan. The quality gate fails the job. No paths filter so the required check always reports.
# workflow_dispatch (no inputs) exists only so a baseline can be produced from a branch.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonar:
    name: sonar
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - name: Require Sonar configuration
        run: |
          missing=""
          [ -n "$SONAR_TOKEN" ] || missing="$missing secret:SONAR_TOKEN"
          [ -n "$SONAR_PROJECT_KEY" ] || missing="$missing variable:SONAR_PROJECT_KEY"
          [ -n "$SONAR_ORGANIZATION" ] || missing="$missing variable:SONAR_ORGANIZATION"
          if [ -n "$missing" ]; then
            echo "::error::Missing SonarCloud configuration:$missing (see docs/bootstrap.md)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
