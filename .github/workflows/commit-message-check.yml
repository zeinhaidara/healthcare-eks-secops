name: commit-message-check

# Blocks commits whose message credits anyone but the repository owner: a Co-authored-by line, a
# "Generated with" line, or a session trailer. A Co-authored-by line passes only if its value exactly
# matches the repository variable ALLOWED_COAUTHOR (set by the owner in repo settings; nothing is
# hardcoded here). Nothing is printed unless a commit fails. See docs/security/commit-message-check.md.
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  commit-message-check:
    name: commit-message-check
    runs-on: ubuntu-latest
    env:
      ALLOWED_COAUTHOR: ${{ vars.ALLOWED_COAUTHOR }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          allowed="${ALLOWED_COAUTHOR:-}"
          failed=0
          for sha in $(git rev-list --no-merges "origin/${BASE_REF}..HEAD"); do
            offending=$(git log -1 --format=%B "$sha" | while IFS= read -r line; do
              lower=$(printf '%s' "$line" | tr '[:upper:]' '[:lower:]')
              case "$lower" in
                co-authored-by:*)
                  value=$(printf '%s' "${line#*:}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
                  if [ -n "$allowed" ] && [ "$value" = "$allowed" ]; then continue; fi
                  printf '%s\n' "$line"
                  ;;
                *"generated with"*) printf '%s\n' "$line" ;;
                [c]laude-session:*) printf '%s\n' "$line" ;;
              esac
            done)
            if [ -n "$offending" ]; then
              failed=1
              printf '%s\n' "$sha"
              printf '%s\n' "$offending" | sed 's/^/  /'
            fi
          done
          exit "$failed"
