name: terraform-destroy

# Manual only, no inputs. Approval on the infra-destroy environment replaces a typed confirmation.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.5
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
  TF_VAR_owner: ${{ vars.OWNER }}
  TF_VAR_cluster_name: ${{ vars.CLUSTER_NAME }}
  TF_VAR_vpc_cidr: ${{ vars.VPC_CIDR }}
  TF_VAR_ecr_repository: ${{ vars.ECR_REPOSITORY }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_cluster_version: ${{ vars.CLUSTER_VERSION }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}

jobs:
  destroy:
    name: tf-destroy
    runs-on: ubuntu-latest
    environment: infra-destroy
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      # Remove namespaces and the Load Balancer Controller before the cluster. Skipped when the
      # cluster is already gone (nothing in it to remove).
      - name: destroy cluster add-ons first
        working-directory: terraform/cluster-addons
        run: |
          if aws eks describe-cluster --name "$TF_VAR_cluster_name" >/dev/null 2>&1; then
            terraform init \
              -backend-config="bucket=${TF_STATE_BUCKET}" \
              -backend-config="region=${AWS_REGION}"
            terraform destroy -auto-approve
          else
            echo "Cluster not found; no add-ons to destroy"
          fi
      - name: init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"
      - name: destroy
        working-directory: terraform
        run: terraform destroy -auto-approve
