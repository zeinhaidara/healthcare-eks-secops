name: app-ci

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  test-lint:
    name: app-test-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: app
      - run: ruff check .
        working-directory: app
      - run: ruff format --check .
        working-directory: app
      - run: pytest
        working-directory: app

  trivy:
    name: app-trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan (dependencies, secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: app
          trivy-config: security/trivy/trivy.yaml
          format: json
          output: trivy-app.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-app-report
          path: trivy-app.json
          retention-days: 90

  checkov:
    name: app-checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install checkov==3.3.26
      - name: Checkov (Dockerfile, workflows)
        run: |
          mkdir reports
          checkov --config-file security/checkov/app.yaml \
            --output json --output sarif --output-file-path reports
      - name: Failed checks
        if: failure()
        run: |
          jq -r '.. | .failed_checks? // empty | .[] | "\(.check_id) \(.file_path) \(.resource)"' reports/results_json.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checkov-app-reports
          path: reports/
          retention-days: 90
