name: dast

# OWASP ZAP baseline scan of the dev app. Report-only: findings never fail the job.
# Manual or weekly, never on push. No secrets, no AWS credentials, no OIDC: the scan reaches the
# app over the internet like any other client. The target is the repository variable DEV_BASE_URL.
# The action uploads the reports itself, as the artifact zap_scan (it has no retention setting).
# Scheduled and manual runs need this file on the default branch (main).
# See docs/runbooks/dast-baseline.md.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC

permissions:
  contents: read

concurrency:
  group: dast
  cancel-in-progress: false

jobs:
  zap-baseline:
    name: zap-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require the target URL
        env:
          DEV_BASE_URL: ${{ vars.DEV_BASE_URL }}
        run: |
          if [ -z "$DEV_BASE_URL" ]; then
            echo "::error::The repository variable DEV_BASE_URL is empty. Set it to the dev app URL (starting with https://) and run again."
            exit 1
          fi
          case "$DEV_BASE_URL" in
            http://* | https://*) ;;
            *)
              echo "::error::DEV_BASE_URL must start with http:// or https://."
              exit 1
              ;;
          esac

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.DEV_BASE_URL }}
          fail_action: false
          allow_issue_writing: false # report only; no GitHub issue (that would need issues: write)
          # ZAP 2.17.0, pinned by digest (the multi-arch index, linux/amd64 and arm64). The action's default is
          # the moving "stable" tag. To update: read the new version and its digest from the registry and change both parts of the image reference.
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6
