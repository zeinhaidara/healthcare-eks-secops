name: dast

# Report-only ZAP scans of dev, never prod. See docs/runbooks/security-scans.md.
on:
  workflow_dispatch: # checkov:skip=CKV_GHA_7:EXC-016 the input only picks which pinned ZAP scan runs against dev; it feeds no build output. owner Moulaye, expires 2027-04-17.
    inputs:
      scan:
        description: Which ZAP scan to run against dev
        type: choice
        options: [baseline, api, full, all]
        default: baseline

permissions:
  contents: read

concurrency:
  group: dast
  cancel-in-progress: false

jobs:
  zap-baseline:
    name: zap-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: inputs.scan == 'baseline' || inputs.scan == 'all'
    steps:
      - name: Require the target URL
        env:
          DEV_BASE_URL: ${{ vars.DEV_BASE_URL }}
        run: |
          if [ -z "$DEV_BASE_URL" ]; then
            echo "::error::The repository variable DEV_BASE_URL is empty. Set it to the dev app URL (starting with https://) and run again."
            exit 1
          fi
          case "$DEV_BASE_URL" in
            http://* | https://*) ;;
            *)
              echo "::error::DEV_BASE_URL must start with http:// or https://."
              exit 1
              ;;
          esac

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.DEV_BASE_URL }}
          fail_action: false
          allow_issue_writing: false # report only; no GitHub issue (that would need issues: write)
          # Pinned by digest; the action's default is the moving "stable" tag.
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6

  # No API key is sent, so keyed endpoints answer 403.
  zap-api:
    name: zap-api
    needs: zap-baseline
    if: >-
      !cancelled() && (inputs.scan == 'api' || inputs.scan == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require the dev target
        id: target
        env:
          DEV_BASE_URL: ${{ vars.DEV_BASE_URL }}
        run: |
          if [ -z "$DEV_BASE_URL" ]; then
            echo "::error::The repository variable DEV_BASE_URL is empty. Set it to the dev app URL (starting with https://) and run again."
            exit 1
          fi
          case "$DEV_BASE_URL" in
            http://* | https://*) ;;
            *) echo "::error::DEV_BASE_URL must start with http:// or https://."; exit 1 ;;
          esac
          case "$DEV_BASE_URL" in
            *prod*) echo "::error::DEV_BASE_URL names prod. This scan runs against dev only."; exit 1 ;;
          esac
          echo "spec=${DEV_BASE_URL%/}/openapi.json" >> "$GITHUB_OUTPUT"

      - name: ZAP API scan
        uses: zaproxy/action-api-scan@5158fe4d9d8fcc75ea204db81317cce7f9e5453d # v0.10.0
        with:
          target: ${{ steps.target.outputs.spec }}
          format: openapi
          fail_action: false
          allow_issue_writing: false # report only; no GitHub issue (that would need issues: write)
          artifact_name: zap_api_scan
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6

  # WARNING: sends active attack traffic. Dev only, never prod.
  zap-full:
    name: zap-full
    needs: [zap-baseline, zap-api]
    if: >-
      !cancelled() && (inputs.scan == 'full' || inputs.scan == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: dast-full # one full scan at a time
      cancel-in-progress: false
    steps:
      - name: Require the dev target
        env:
          DEV_BASE_URL: ${{ vars.DEV_BASE_URL }}
        run: |
          if [ -z "$DEV_BASE_URL" ]; then
            echo "::error::The repository variable DEV_BASE_URL is empty. Set it to the dev app URL (starting with https://) and run again."
            exit 1
          fi
          case "$DEV_BASE_URL" in
            http://* | https://*) ;;
            *) echo "::error::DEV_BASE_URL must start with http:// or https://."; exit 1 ;;
          esac
          case "$DEV_BASE_URL" in
            *prod*) echo "::error::DEV_BASE_URL names prod. This scan runs against dev only."; exit 1 ;;
          esac

      - name: ZAP full scan (active, dev only)
        uses: zaproxy/action-full-scan@3c58388149901b9a03b7718852c5ba889646c27c # v0.13.0
        with:
          target: ${{ vars.DEV_BASE_URL }}
          fail_action: false
          allow_issue_writing: false # report only; no GitHub issue (that would need issues: write)
          artifact_name: zap_full_scan
          # ZAP 2.17.0 by digest, the same image as the baseline scan (dast.yml).
          docker_name: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6
