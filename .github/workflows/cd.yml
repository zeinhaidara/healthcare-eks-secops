name: cd

# Prod values change on dev but reach prod only on release to main, because prod syncs from main.
on:
  push:
    branches: [dev]
    paths:
      - "app/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "cd-${{ github.ref }}"
  cancel-in-progress: false

env:
  IMAGE_NAME: healthcare-api
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  AWS_REGION: ${{ vars.AWS_REGION }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: |
          docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" app
          docker save "${IMAGE_NAME}:${GITHUB_SHA}" | gzip > image.tar.gz
          gunzip -c image.tar.gz > image.tar
      - name: Trivy image scan (blocks the push on HIGH or CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          input: image.tar
          trivy-config: security/trivy/trivy.yaml
          # The action's defaults override trivy.yaml, so these repeat it; keep them in sync.
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"
          format: json
          output: trivy-image.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-image-report
          path: trivy-image.json
          retention-days: 90
      # The exact image that passed the scan is the one pushed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-image
          path: image.tar.gz
          retention-days: 1

  push:
    name: push
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-image
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      # Tags are immutable, so a tag is never reused. A re-run of this job finds the tag and skips.
      - name: Push image by commit SHA
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Tag $GITHUB_SHA already in ECR, not pushing again"
            exit 0
          fi
          gunzip -c image.tar.gz | docker load
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
      # The digest pins exactly the image that passed the scan; the tag stays as a label.
      - name: Resolve the pushed image digest
        id: digest
        run: |
          digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)
          case "$digest" in sha256:*) ;; *) echo "::error::No digest for tag $GITHUB_SHA"; exit 1 ;; esac
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

  # The bump touches only helm values and uses the workflow token, so it cannot trigger another build.
  bump-image:
    name: bump-image
    needs: push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      IMAGE_DIGEST: ${{ needs.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
      - name: Set the image tag and digest in both values files and push to dev
        run: |
          short="${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for env in dev prod; do
            IMAGE_TAG="$GITHUB_SHA" yq -i '.image.tag = strenv(IMAGE_TAG) | .image.digest = strenv(IMAGE_DIGEST)' \
              "helm/healthcare-api/values-${env}.yaml"
          done
          if git diff --quiet; then
            echo "Tag and digest already set; nothing to bump"
            exit 0
          fi
          git commit -am "chore: bump image to ${short}"
          for attempt in 1 2 3; do
            if git pull --rebase origin dev && git push origin HEAD:dev; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Push to dev was rejected (attempt ${attempt} of 3); pulling and retrying"
            sleep $((attempt * 3))
          done
          echo "::error::Could not push the image bump to dev after 3 attempts. Check the dev ruleset and whether dev changed the same lines."
          exit 1
