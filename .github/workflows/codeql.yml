name: codeql

# CodeQL analyses Python (app/) and GitHub Actions workflows. CodeQL does not support Terraform;
# Checkov (terraform-ci) covers it. No paths filter so the required check always reports.
# workflow_dispatch (no inputs) exists only so a baseline can be produced from a branch.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: python,actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          output: sarif-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 90
      # Fails the job on HIGH or CRITICAL (security-severity 7.0 or more). Code scanning alerts alone do not.
      - name: Gate on high and critical findings
        run: python3 security/codeql/sarif_gate.py sarif-results --fail-on 7.0
