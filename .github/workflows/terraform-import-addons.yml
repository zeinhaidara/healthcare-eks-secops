name: terraform-import-addons

# One-time import of the two healthcare-api ServiceAccounts that Helm created, so Terraform can own
# them (terraform/cluster-addons). Safe to re-run: an address already in state is skipped.
# It changes state only and ends with a plan for review. It creates, changes and destroys nothing in
# the cluster. Remove this workflow once the import is confirmed.
# Manual only, no inputs. Environment infra needs reviewer approval and accepts the main branch only.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.5
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
  TF_VAR_owner: ${{ vars.OWNER }}
  TF_VAR_cluster_name: ${{ vars.CLUSTER_NAME }}
  TF_VAR_vpc_cidr: ${{ vars.VPC_CIDR }}
  TF_VAR_ecr_repository: ${{ vars.ECR_REPOSITORY }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_cluster_version: ${{ vars.CLUSTER_VERSION }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}

jobs:
  import:
    name: import
    runs-on: ubuntu-latest
    environment: infra
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: init
        working-directory: terraform/cluster-addons
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"
      # The two namespaces are the defaults of var.app_namespaces (dev first, then prod). They are
      # written here on purpose so a changed variable cannot silently import the wrong object.
      - name: import the ServiceAccounts missing from state
        working-directory: terraform/cluster-addons
        run: |
          in_state=$(terraform state list || true)
          for spec in "dev:cloudbatch818-healthcare-dev" "prod:cloudbatch818-healthcare-prod"; do
            key="${spec%%:*}"
            namespace="${spec#*:}"
            address="kubernetes_service_account_v1.app[\"${key}\"]"
            if printf '%s\n' "$in_state" | grep -Fxq "$address"; then
              echo "Already in state, skipping: $address"
            else
              terraform import "$address" "${namespace}/healthcare-api"
            fi
          done
      - name: plan after the import
        working-directory: terraform/cluster-addons
        run: |
          set -o pipefail
          terraform plan -no-color -out=addons.tfplan | tee plan.txt
          summary=$(grep -E '^(Plan:|No changes)' plan.txt || true)
          sa_creates=$(grep -cE '# kubernetes_service_account_v1\.app\[.*will be created' plan.txt || true)
          {
            echo "### Add-ons plan after the import"
            echo
            echo "${summary:-No summary line found in the plan output}"
            echo
            echo "ServiceAccount creates in the plan: ${sa_creates}"
          } >> "$GITHUB_STEP_SUMMARY"
