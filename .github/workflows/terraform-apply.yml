name: terraform-apply

# Manual only, no inputs. Read the plan in tf-plan, then approve tf-apply (environment infra).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.5
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
  TF_VAR_owner: ${{ vars.OWNER }}
  TF_VAR_cluster_name: ${{ vars.CLUSTER_NAME }}
  TF_VAR_vpc_cidr: ${{ vars.VPC_CIDR }}
  TF_VAR_ecr_repository: ${{ vars.ECR_REPOSITORY }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_cluster_version: ${{ vars.CLUSTER_VERSION }}
  TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
  TF_VAR_route53_zone_id: ${{ vars.ROUTE53_ZONE_ID }}

jobs:
  plan:
    name: tf-plan
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"
      - run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform validate
        working-directory: terraform
      - name: plan
        working-directory: terraform
        run: |
          terraform plan -out=tfplan
          terraform show -no-color tfplan > plan.txt
          # The Lambda zip is built at plan time, so ship it and its hash to the apply runner.
          find modules -path '*/build/*.zip' -print0 | xargs -0 -r sha256sum > zips.sha256
          test -s zips.sha256
      # Runs before the plan upload, so a blocked plan leaves tf-apply nothing to apply. No override.
      - name: destructive plan guard
        working-directory: terraform
        run: |
          pattern='^[[:space:]]*# ([^ ]+\.)?(aws_s3_bucket(_[a-z0-9_]+)?|aws_kms_key|aws_dynamodb_table)\.[^ ]+ .*(will be destroyed|must be replaced|will be replaced)'
          test -s plan.txt || { echo "::error::plan.txt missing or empty"; exit 1; }
          # Only grep exit 1 (no match) passes. The default shell runs with -e, so capture rc with ||.
          rc=0
          grep -qE "$pattern" plan.txt || rc=$?
          if [ "$rc" -eq 0 ]; then
            grep -E "$pattern" plan.txt
            echo "::error::Plan deletes or replaces a protected resource (lines above). Blocked."
            exit 1
          elif [ "$rc" -ne 1 ]; then
            echo "::error::guard grep failed (exit $rc)"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan
          path: |
            terraform/tfplan
            terraform/plan.txt
            terraform/zips.sha256
            terraform/modules/*/build/*.zip
          retention-days: 7

  apply:
    name: tf-apply
    needs: plan
    runs-on: ubuntu-latest
    environment: infra
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan
          path: terraform
      - name: verify Lambda package
        working-directory: terraform
        run: |
          test -s zips.sha256
          sha256sum -c zips.sha256
      - name: init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"
      - name: apply the reviewed plan
        working-directory: terraform
        run: terraform apply tfplan

  # Second root (cluster-addons); it needs the cluster from tf-apply.
  addons-plan:
    name: addons-plan
    needs: apply
    runs-on: ubuntu-latest
    environment: infra
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: init
        working-directory: terraform/cluster-addons
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"
      - run: terraform fmt -check
        working-directory: terraform/cluster-addons
      - run: terraform validate
        working-directory: terraform/cluster-addons
      - name: plan
        working-directory: terraform/cluster-addons
        run: |
          terraform plan -out=addons.tfplan
          terraform show -no-color addons.tfplan > addons-plan.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: addons-tfplan
          path: |
            terraform/cluster-addons/addons.tfplan
            terraform/cluster-addons/addons-plan.txt
          retention-days: 7

  addons-apply:
    name: addons-apply
    needs: addons-plan
    runs-on: ubuntu-latest
    environment: infra
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: addons-tfplan
          path: terraform/cluster-addons
      - name: init
        working-directory: terraform/cluster-addons
        run: |
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="region=${AWS_REGION}"
      - name: apply the reviewed add-ons plan
        working-directory: terraform/cluster-addons
        run: terraform apply addons.tfplan
