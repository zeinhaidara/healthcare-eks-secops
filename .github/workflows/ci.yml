name: ci

# Checks only. No AWS credentials, no OIDC, no registry push. All AWS access lives in cd.yml and the
# terraform-* workflows. No paths filter so every required check always reports.
# Job names are the required status check names on main; do not rename them.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  app-test-lint:
    name: app-test-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: app
      - run: ruff check .
        working-directory: app
      - run: ruff format --check .
        working-directory: app
      # coverage.xml feeds the sonar job (new-code coverage is a quality gate condition)
      - run: pytest --cov=src --cov-report=xml
        working-directory: app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-app
          path: app/coverage.xml
          retention-days: 90

  lambda-test:
    name: lambda-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      # Unit tests for the rotation Lambda; boto3 is faked, no AWS calls.
      - run: >
          pytest terraform/modules/secret-rotation/tests
          --cov=terraform/modules/secret-rotation/src --cov-report=xml:lambda-coverage.xml -p no:cacheprovider
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lambda
          path: lambda-coverage.xml
          retention-days: 90

  app-trivy:
    name: app-trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan (dependencies, secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: app
          trivy-config: security/trivy/trivy.yaml
          # The action exports its own defaults (all severities, ignore-unfixed false) that override
          # trivy.yaml, so the same values are set here. Keep in sync with security/trivy/trivy.yaml.
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"
          format: json
          output: trivy-app.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-app-report
          path: trivy-app.json
          retention-days: 90

  app-build:
    name: app-build
    needs: app-test-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Built locally and handed to the next job as a tar. Nothing is pushed anywhere.
      - name: Build image
        run: |
          docker build -t "healthcare-api:${GITHUB_SHA}" app
          docker save "healthcare-api:${GITHUB_SHA}" | gzip > image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-image
          path: image.tar.gz
          retention-days: 1

  app-image-scan:
    name: app-image-scan
    needs: app-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-image
      - run: gunzip image.tar.gz
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          input: image.tar
          trivy-config: security/trivy/trivy.yaml
          # The action exports its own defaults (all severities, ignore-unfixed false) that override
          # trivy.yaml, so the same values are set here. Keep in sync with security/trivy/trivy.yaml.
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"
          format: json
          output: trivy-image.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-image-report
          path: trivy-image.json
          retention-days: 90

  app-checkov:
    name: app-checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install checkov==3.3.26
      # security/checkov/app.yaml covers the Dockerfile and all workflows. Add the rendered
      # Helm output (helm template) here when the chart lands in Phase 4.
      - name: Checkov (Dockerfile, workflows)
        run: |
          mkdir reports
          checkov --config-file security/checkov/app.yaml \
            --output json --output sarif --output-file-path reports
      - name: Failed checks
        if: failure()
        run: |
          jq -r '.. | .failed_checks? // empty | .[] | "\(.check_id) \(.file_path) \(.resource)"' reports/results_json.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checkov-app-reports
          path: reports/
          retention-days: 90

  tf-validate:
    name: tf-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate

  tf-checkov:
    name: tf-checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install checkov==3.3.26
      - name: Checkov (terraform)
        run: |
          mkdir reports
          checkov --config-file security/checkov/terraform.yaml \
            --output json --output sarif --output-file-path reports
      - name: Failed checks
        if: failure()
        run: |
          jq -r '.. | .failed_checks? // empty | .[] | "\(.check_id) \(.file_path) \(.resource)"' reports/results_json.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checkov-terraform-reports
          path: reports/
          retention-days: 90

  # CodeQL analyses Python (app/) and GitHub Actions workflows. CodeQL does not support
  # Terraform; Checkov (tf-checkov) covers it.
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: python,actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          output: sarif-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 90
      # Fails the job on HIGH or CRITICAL (security-severity 7.0 or more). Code scanning alerts alone do not.
      - name: Gate on high and critical findings
        run: python3 security/codeql/sarif_gate.py sarif-results --fail-on 7.0

  sonar:
    name: sonar
    needs: [app-test-lint, lambda-test]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - name: Require Sonar configuration
        run: |
          missing=""
          [ -n "$SONAR_TOKEN" ] || missing="$missing secret:SONAR_TOKEN"
          [ -n "$SONAR_PROJECT_KEY" ] || missing="$missing variable:SONAR_PROJECT_KEY"
          [ -n "$SONAR_ORGANIZATION" ] || missing="$missing variable:SONAR_ORGANIZATION"
          if [ -n "$missing" ]; then
            echo "::error::Missing SonarCloud configuration:$missing (see docs/bootstrap.md)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-app
          path: app
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-lambda
          path: .
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
