name: ci

# No AWS access and no paths filter, so every required check always reports. Job names are required checks.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  app-test-lint:
    name: app-test-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: app
      - run: ruff check .
        working-directory: app
      - run: ruff format --check .
        working-directory: app
      # coverage.xml feeds the sonar job (new-code coverage is a quality gate condition)
      - run: pytest --cov=src --cov-report=xml
        working-directory: app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-app
          path: app/coverage.xml
          retention-days: 90

  lambda-test:
    name: lambda-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      # Unit tests for the rotation Lambda; boto3 is faked, no AWS calls.
      - run: >
          pytest terraform/modules/secret-rotation/tests
          --cov=terraform/modules/secret-rotation/src --cov-report=xml:lambda-coverage.xml -p no:cacheprovider
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lambda
          path: lambda-coverage.xml
          retention-days: 90

  app-trivy:
    name: app-trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan (dependencies, secrets)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: fs
          scan-ref: app
          trivy-config: security/trivy/trivy.yaml
          # The action's defaults override trivy.yaml, so these repeat it; keep them in sync.
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"
          format: json
          output: trivy-app.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-app-report
          path: trivy-app.json
          retention-days: 90

  app-build:
    name: app-build
    needs: app-test-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Built locally and handed to the next job as a tar. Nothing is pushed anywhere.
      - name: Build image
        run: |
          docker build -t "healthcare-api:${GITHUB_SHA}" app
          docker save "healthcare-api:${GITHUB_SHA}" | gzip > image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-image
          path: image.tar.gz
          retention-days: 1

  app-image-scan:
    name: app-image-scan
    needs: app-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-image
      - run: gunzip image.tar.gz
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          scan-type: image
          input: image.tar
          trivy-config: security/trivy/trivy.yaml
          # The action's defaults override trivy.yaml, so these repeat it; keep them in sync.
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"
          format: json
          output: trivy-image.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: trivy-image-report
          path: trivy-image.json
          retention-days: 90

  app-checkov:
    name: app-checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install checkov==3.3.26
      - name: Checkov (Dockerfile, workflows)
        run: |
          mkdir reports
          checkov --config-file security/checkov/app.yaml \
            --output json --output sarif --output-file-path reports
      - name: Failed checks
        if: failure()
        run: |
          jq -r '.. | .failed_checks? // empty | .[] | "\(.check_id) \(.file_path) \(.resource)"' reports/results_json.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checkov-app-reports
          path: reports/
          retention-days: 90

  tf-validate:
    name: tf-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate
      - run: terraform -chdir=terraform/cluster-addons init -backend=false -input=false
      - run: terraform -chdir=terraform/cluster-addons validate

  tf-checkov:
    name: tf-checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install checkov==3.3.26
      - name: Checkov (terraform)
        run: |
          mkdir reports
          checkov --config-file security/checkov/terraform.yaml \
            --output json --output sarif --output-file-path reports
      - name: Failed checks
        if: failure()
        run: |
          jq -r '.. | .failed_checks? // empty | .[] | "\(.check_id) \(.file_path) \(.resource)"' reports/results_json.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: checkov-terraform-reports
          path: reports/
          retention-days: 90

  # CodeQL has no Terraform support; tf-checkov covers it.
  codeql:
    name: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: python,actions
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          output: sarif-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-sarif
          path: sarif-results
          retention-days: 90
      # Fails the job on HIGH or CRITICAL (security-severity 7.0 or more). Code scanning alerts alone do not.
      - name: Gate on high and critical findings
        run: python3 security/codeql/sarif_gate.py sarif-results --fail-on 7.0

  sonar:
    name: sonar
    needs: [app-test-lint, lambda-test]
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - name: Require Sonar configuration
        run: |
          missing=""
          [ -n "$SONAR_TOKEN" ] || missing="$missing secret:SONAR_TOKEN"
          [ -n "$SONAR_PROJECT_KEY" ] || missing="$missing variable:SONAR_PROJECT_KEY"
          [ -n "$SONAR_ORGANIZATION" ] || missing="$missing variable:SONAR_ORGANIZATION"
          if [ -n "$missing" ]; then
            echo "::error::Missing SonarCloud configuration:$missing (see docs/bootstrap.md)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-app
          path: app
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-lambda
          path: .
      # Gate waits on pull requests only: the free plan cannot return gate status for non-main branches.
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' && 'true' || 'false' }}

  # The CLI, not gitleaks-action: the action skips merge parents, so a release merge scanned 0 commits.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb" # gitleaks_8.30.1_linux_x64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (checked against the pinned SHA-256)
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history
        run: |
          "$RUNNER_TEMP/gitleaks" detect --source . --config .gitleaks.toml --redact --no-banner -v \
            --exit-code 2 --log-opts=--all

  # Report-only scans (tflint, kubescape, pip-audit): findings never fail the build.
  tflint:
    name: tflint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
          checksums: cca9d13e2e1d7a2c627af60ff899a3c9b74212899416aeb96ec764d2ef954537 # tflint_linux_amd64.zip
      - name: Install the rulesets
        run: tflint --chdir=terraform --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Modules have no config of their own, so the root one is passed explicitly.
      - name: Lint (report only)
        run: |
          tflint --chdir=terraform --recursive --config="$GITHUB_WORKSPACE/terraform/.tflint.hcl" \
            --format=json --force > "$RUNNER_TEMP/tflint.json"
          python3 - "$RUNNER_TEMP/tflint.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import collections, json, sys
          r = json.load(open(sys.argv[1]))
          c = collections.Counter(i["rule"]["name"] for i in r.get("issues", []))
          print(f"### tflint: {sum(c.values())} issue(s), {len(r.get('errors', []))} error(s)\n")
          print("| Rule | Count |\n|---|---|")
          for rule, n in c.most_common():
              print(f"| `{rule}` | {n} |")
          PY
          cp "$RUNNER_TEMP/tflint.json" tflint.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tflint-report
          path: tflint.json
          retention-days: 14

  kubescape:
    name: kubescape
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KUBESCAPE_VERSION: "4.0.16"
      KUBESCAPE_SHA256: "fcf172f0d1fb5683379586bcf8875091da4d0d815bd304f8098d58be65ecab0d" # kubescape_4.0.16_linux_amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Values Terraform passes at deploy time get placeholders; Argo CD's main.tf values are not rendered.
      - name: Render the charts
        env:
          VPC_CIDR: ${{ vars.VPC_CIDR }}
        run: |
          set -euo pipefail
          mkdir -p rendered reports
          helm version --short
          helm template healthcare-api helm/healthcare-api -n cloudbatch818-healthcare-dev \
            -f helm/healthcare-api/values.yaml -f helm/healthcare-api/values-dev.yaml \
            --set image.repository=registry.invalid/healthcare-api \
            --set ingress.certificateArn=placeholder \
            --set networkPolicy.vpcCidr="${VPC_CIDR:-placeholder}" \
            --set env.apiKeySecretName=placeholder > rendered/healthcare-api.yaml
          argo_version="$(sed -n '/variable "argocd_chart_version"/,/^}/s/.*default *= *"\(.*\)"/\1/p' terraform/cluster-addons/variables.tf)"
          helm repo add argo https://argoproj.github.io/argo-helm
          helm template argocd argo/argo-cd --version "$argo_version" -n argocd \
            -f terraform/cluster-addons/values/argocd.yaml > rendered/argocd.yaml
      - name: Install kubescape (checked against the pinned SHA-256)
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/kubescape" \
            "https://github.com/kubescape/kubescape/releases/download/v${KUBESCAPE_VERSION}/kubescape_${KUBESCAPE_VERSION}_linux_amd64"
          echo "${KUBESCAPE_SHA256}  $RUNNER_TEMP/kubescape" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/kubescape"
      # One framework per run (a comma list drops the second); the EKS CIS framework finds nothing in files.
      - name: Scan with NSA and CIS (report only)
        run: |
          for fw in nsa cis-v1.12.0; do
            for chart in healthcare-api argocd; do
              "$RUNNER_TEMP/kubescape" scan framework "$fw" "rendered/$chart.yaml" \
                --format json --output "reports/$fw-$chart.json" || true
            done
          done
          python3 - reports >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib, sys
          print("### Kubescape: failed controls by ID (resources failing)\n")
          for f in sorted(pathlib.Path(sys.argv[1]).glob("*.json")):
              r = json.loads(f.read_text())
              ctrls = r.get("summaryDetails", {}).get("controls", {}) or {}
              failed = sorted(((c.get("ResourceCounters") or {}).get("failedResources", 0), cid, c.get("name", ""))
                              for cid, c in ctrls.items() if (c.get("ResourceCounters") or {}).get("failedResources", 0))
              print(f"**{f.stem}**: {len(failed)} failed of {len(ctrls)} evaluated\n")
              for n, cid, name in sorted(failed, reverse=True):
                  print(f"- `{cid}` {name}: {n}")
              print()
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: kubescape-reports
          path: |
            rendered/
            reports/
          retention-days: 14

  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: pypa/gh-action-pip-audit@1220774d901786e6f652ae159f7b6bc8fea6d266 # v1.1.0
        continue-on-error: true
        with:
          inputs: app/requirements.txt

  # Fargate rejects runAsGroup without runAsUser, which makes terraform-apply hang on the Argo CD release.
  securitycontext-check:
    name: securitycontext-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Render the charts
        run: |
          set -euo pipefail
          mkdir -p rendered
          argo_version="$(sed -n '/variable "argocd_chart_version"/,/^}/s/.*default *= *"\(.*\)"/\1/p' terraform/cluster-addons/variables.tf)"
          helm repo add argo https://argoproj.github.io/argo-helm
          helm template argocd argo/argo-cd --version "$argo_version" -n argocd \
            -f terraform/cluster-addons/values/argocd.yaml > rendered/argocd.yaml
          for env in dev prod; do
            helm template healthcare-api helm/healthcare-api -n "cloudbatch818-healthcare-$env" \
              -f helm/healthcare-api/values.yaml -f "helm/healthcare-api/values-$env.yaml" \
              --set image.repository=registry.invalid/healthcare-api --set ingress.certificateArn=placeholder \
              --set networkPolicy.vpcCidr=placeholder --set env.apiKeySecretName=placeholder > "rendered/healthcare-api-$env.yaml"
          done
      - name: Check runAsGroup has runAsUser
        run: |
          pip install --quiet pyyaml==6.0.2
          python3 scripts/check_run_as_user.py rendered/*.yaml

