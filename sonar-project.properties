# Project key and organization are not set here; the workflow passes them from repo variables.
sonar.sources=app/src,terraform
sonar.tests=app/tests,terraform/modules/secret-rotation/tests
# Test files are listed in sonar.tests, so they must not also be sources. No source is excluded from coverage.
sonar.exclusions=**/.terraform/**,**/build/**,**/*.tfstate*,terraform/.terraform.lock.hcl,terraform/modules/secret-rotation/tests/**
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
# Written by the app-test-lint and lambda-test jobs in ci.yml and downloaded by the sonar job.
sonar.python.coverage.reportPaths=app/coverage.xml,lambda-coverage.xml
