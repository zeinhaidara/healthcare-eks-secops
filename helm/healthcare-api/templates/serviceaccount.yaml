apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "healthcare-api.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "serviceAccount.roleArn is required (set at deploy time)" .Values.serviceAccount.roleArn | quote }}
# The IRSA webhook adds its own projected token; the default API token is not needed.
automountServiceAccountToken: false
