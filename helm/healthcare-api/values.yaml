# Base values. Environment files (values-dev.yaml, values-prod.yaml) override host, sizing and the
# image tag and digest, which cd.yml updates by pull request after each build.
# Values that depend on the AWS account are NOT set in Git: Argo CD receives them as Application
# parameters from terraform/cluster-addons (image.repository, ingress.certificateArn,
# networkPolicy.vpcCidr, ingress.projectTag, env.apiKeySecretName). Argo CD deploys; CI does not.

replicaCount: 2

image:
  repository: "" # required, an Argo CD Application parameter from Terraform
  tag: "" # required, the commit SHA, set by the cd.yml pull request
  digest: "" # set by the cd.yml pull request (sha256:...); when set the image is pulled by digest, the tag stays as a label
  pullPolicy: Always

containerPort: 8080

# Extra pod annotations. Nothing sets any today. The API key is read only at startup, so after a
# key rotation restart the pods (docs/runbooks/rotation.md). Empty values are not rendered.
podAnnotations: {}

serviceAccount:
  # The environment values files set create to false: Terraform owns the ServiceAccount and its IRSA
  # role annotation (terraform/cluster-addons). The chart then only refers to it by name.
  create: true
  name: healthcare-api # IRSA trust is pinned to <namespace>:healthcare-api
  roleArn: "" # only used when create is true

env:
  awsRegion: us-east-2
  dynamodbTable: cloudbatch818-zein-hcsecops-patients
  apiKeySecretName: cloudbatch818-zein-hcsecops-api-key

# /ready returns 503 until the API key loads from Secrets Manager, so a pod without a key value
# stays out of the ALB target group by design.
probes:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Fargate sizes the pod from requests, rounded up to the next supported combination.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

service:
  port: 80

ingress:
  enabled: true
  className: alb
  host: "" # required, set per environment
  certificateArn: "" # required, an Argo CD Application parameter from Terraform
  # Default for local template renders only. Argo CD gets this from Terraform's project_name (the
  # PROJECT_NAME repo variable). The budget module's cost_tag_value (terraform/modules/budget/variables.tf)
  # is separate and must be changed in the same PR if PROJECT_NAME changes.
  projectTag: cloudbatch818

# Needs metrics-server, which Terraform installs in terraform/cluster-addons. Autoscaling stays off until it is turned on here.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Default-deny with the traffic the app needs. Kept for intent: the VPC CNI network policy agent does
# not run on Fargate, so these are NOT enforced there (SEC-021). Pod isolation on Fargate comes from
# security groups for pods (see the note at the end of this file).
networkPolicy:
  enabled: true
  vpcCidr: "" # required, an Argo CD Application parameter from Terraform (the VPC CIDR)

# Security groups for pods (Fargate): the SecurityGroupPolicy is owned by terraform/cluster-addons (created by
# the apply role), not by this chart (SEC-032).
